<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>红油地图</title>
<meta name="description" content="跟着盗月社吃遍中国西南：云南、贵州的城市、菜品、价格和主播原话，每一道菜都能跳回视频里的那一秒。">
<meta property="og:title" content="红油地图 · 跟着盗月社吃遍西南">
<meta property="og:description" content="盗月社云南、贵州美食视频整理成的西南美食地图。点任意一句原话，就能看原视频里的那一秒。">
<meta property="og:image" content="https://i.ytimg.com/vi/pGrNXPXiTxg/maxresdefault.jpg">
<meta name="theme-color" content="#1c1410">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Gloock&amp;family=Noto+Serif+SC:wght@600;900&amp;display=swap">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23d9542f'/%3E%3Cpath d='M18 26h28M18 38h28M26 18v28M38 18v28' stroke='%23fbe7c8' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip" href="#cities">跳到城市</a>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#top" aria-label="红油地图，回到顶部"><span class="brand-zh">红油地图</span><span class="brand-en">跟着盗月社吃西南</span></a>
    <nav class="nav" aria-label="页面导航">
      <a href="#map" data-i18n="nav.map">地图</a>
      <a href="#cities" data-i18n="nav.cities">城市</a>
      <a href="#menu" data-i18n="nav.menu">菜单</a>
      <a href="#videos" data-i18n="nav.videos">视频</a>
      <a href="#notes" data-i18n="nav.notes">贴士</a>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero" aria-labelledby="hero-title" data-screen-label="Hero">
    <div class="hero-photos" id="hero-photos" aria-hidden="true"></div>
    <div class="hero-shade" aria-hidden="true"></div>
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="eyebrow" data-i18n="hero.eyebrow">中国西南美食实地指南</p>
        <h1 id="hero-title">
          <span class="h1-en" data-i18n="hero.title">西南，一碗一碗吃过去。</span>
          <span class="h1-zh" hidden="">西南，一碗一碗吃过去。</span>
        </h1>
        <p class="lede" data-i18n-html="hero.lede"></p>
        <dl class="stats" id="stats"></dl>
      </div>
      <figure class="pot-fig">
        <svg id="pot" class="pot" viewBox="0 0 400 400" role="img" aria-labelledby="pot-title"><title id="pot-title">九宫格火锅：每一格是一座城市，点击跳到对应章节。</title></svg>
        <figcaption data-i18n="hero.pot"></figcaption>
      </figure>
    </div>
  </section>

  <section id="map" class="band" aria-labelledby="map-title" data-screen-label="Map">
    <div class="wrap">
      <header class="sec-head">
        <p class="eyebrow" data-i18n="map.eyebrow">吃过的地方</p>
        <h2 id="map-title" data-i18n="map.title">地图</h2>
        <p class="sec-sub" data-i18n="map.sub"></p>
      </header>
      <div class="map-grid">
        <div class="map-box"><svg id="map-svg" role="img" aria-label="中国西南地图，标出盗月社去过的地方"></svg></div>
        <aside class="map-card" id="map-card" aria-live="polite"></aside>
      </div>
      <ul class="legend" id="legend"></ul>
    </div>
  </section>

  <section id="cities" aria-labelledby="cities-title" data-screen-label="Cities">
    <div class="wrap">
      <header class="sec-head">
        <p class="eyebrow" data-i18n="cities.eyebrow">一城一城看</p>
        <h2 id="cities-title" data-i18n="cities.title">他们怎么评价每个地方</h2>
      </header>
      <nav class="city-index" id="city-index" aria-label="跳到城市"></nav>
    </div>
    <div id="city-list"></div>
  </section>

  <section id="menu" class="band" aria-labelledby="menu-title" data-screen-label="Menu">
    <div class="wrap">
      <header class="sec-head">
        <p class="eyebrow" data-i18n="menu.eyebrow">所有菜，一张菜单</p>
        <h2 id="menu-title" data-i18n="menu.title">菜单</h2>
        <p class="sec-sub" data-i18n="menu.sub"></p>
      </header>
      <form class="filters" id="filters" autocomplete="off">
        <label class="search" for="q"><span class="sr" data-i18n="menu.search">搜索菜品</span></label>
        <input type="search" id="q" placeholder="搜索：米线、火锅、昆明…">
        <div class="chips" id="f-province" role="group" aria-label="省份"></div>
        <div class="chips" id="f-cat" role="group" aria-label="类别"></div>
        <div class="row-ctl">
          <label class="heat" for="f-heat"><span data-i18n="menu.heat">最高辣度</span></label>
          <input type="range" id="f-heat" min="0" max="5" step="1" value="5">
          <output id="f-heat-out" for="f-heat">5</output>
          <label class="sort" for="f-sort"><span data-i18n="menu.sort">排序</span></label>
          <select id="f-sort">
            <option value="score" data-i18n="menu.sort.score">最受好评</option>
            <option value="price" data-i18n="menu.sort.price">最便宜</option>
            <option value="heat" data-i18n="menu.sort.heat">最辣</option>
            <option value="city" data-i18n="menu.sort.city">按城市</option>
          </select>
          <p class="count" id="menu-count" aria-live="polite"></p>
        </div>
      </form>
      <ol class="menu" id="menu-list"></ol>
    </div>
  </section>

  <section id="videos" aria-labelledby="videos-title" data-screen-label="Episodes">
    <div class="wrap">
      <header class="sec-head">
        <p class="eyebrow" data-i18n="videos.eyebrow">原始素材</p>
        <h2 id="videos-title" data-i18n="videos.title">本页用到的视频</h2>
        <p class="sec-sub" data-i18n="videos.sub"></p>
      </header>
      <div class="chips" id="v-province" role="group" aria-label="按省份筛选视频"></div>
      <ul class="vgrid" id="video-grid"></ul>
      <div class="pending">
        <h3 data-i18n="pending.title">还没整理：重庆、四川、西藏</h3>
        <p class="sec-sub" data-i18n="pending.sub"></p>
        <ul class="plist" id="pending-list"></ul>
      </div>
    </div>
  </section>

  <section id="notes" class="band" aria-labelledby="notes-title" data-screen-label="Field notes">
    <div class="wrap">
      <header class="sec-head">
        <p class="eyebrow" data-i18n="notes.eyebrow">出发之前</p>
        <h2 id="notes-title" data-i18n="notes.title">实用贴士</h2>
        <p class="sec-sub" data-i18n="notes.sub"></p>
      </header>
      <aside class="scale-key">
        <h3 data-i18n="key.title">怎么看辣度</h3>
        <p data-i18n-html="key.body"></p>
        <p class="fx" id="fx-note"></p>
      </aside>
      <div class="notes" id="notes-list"></div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <p data-i18n-html="foot.credit"></p>
    <p data-i18n-html="foot.method"></p>
    <p class="muted" id="foot-gen"></p>
  </div>
</footer>

<dialog id="player" class="player" aria-labelledby="pl-title">
  <div class="pl-frame"><div id="pl-embed"></div></div>
  <div class="pl-side">
    <button type="button" class="x-btn" id="pl-close" aria-label="关闭播放器">×</button>
    <p class="eyebrow" id="pl-where"></p>
    <h3 id="pl-title"></h3>
    <blockquote class="pl-quote" id="pl-quote"></blockquote>
    <p class="pl-meta" id="pl-meta"></p>
    <a class="pl-yt" id="pl-yt" target="_blank" rel="noopener" data-i18n="pl.yt">在 YouTube 打开 ↗</a>
  </div>
</dialog>

<dialog id="dish" class="dish-dlg" aria-labelledby="dd-title"><div id="dish-body"></div></dialog>

<script src="assets/app.js" defer=""></script>
</body>
</html>
